<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Abajur</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090D16;
      color: #F8FAFC;
      -webkit-tap-highlight-color: transparent;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      height: 12px;
      border-radius: 999px;
      background: linear-gradient(90deg, #1E293B 0%, #F59E0B 55%, #FEF08A 100%);
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid #F59E0B;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.7);
      margin-top: -7px;
      transition: transform 0.15s ease;
    }
    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.15);
    }
    .lamp-orb {
      transition: box-shadow 0.12s ease, background 0.12s ease, opacity 0.12s ease;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 max-w-xl mx-auto select-none">

  <!-- Toast Notification -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-800/95 border border-slate-700 text-xs sm:text-sm text-slate-100 shadow-xl transition-all duration-200">
    <span id="toastText">Conectado</span>
  </div>

  <!-- Top Header, Battery Indicator & Bluetooth Connection -->
  <header class="space-y-4">
    <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 rounded-2xl p-4 shadow-lg">
      <div class="flex items-center gap-3.5">
        <div id="lampOrb" class="lamp-orb w-12 h-12 rounded-2xl flex items-center justify-center bg-amber-400/20 border border-amber-400/40">
          <svg class="w-6 h-6 text-amber-300" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-tight text-white">Meu Abajur</h1>
          <div class="flex items-center gap-2 mt-0.5">
            <span id="statusDot" class="w-2 h-2 rounded-full bg-rose-500 inline-block"></span>
            <span id="statusText" class="text-xs font-medium text-slate-400">Desconectado</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2.5">
        <!-- Battery Pill -->
        <div id="batteryBadge" class="flex items-center gap-1.5 px-3 py-2 rounded-xl bg-slate-800/90 border border-slate-700/80">
          <svg id="batteryIcon" class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="2" y="7" width="16" height="10" rx="2" ry="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 11v2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect id="batteryFillRect" x="4" y="9" width="12" height="6" rx="1" fill="currentColor" stroke="none"/>
          </svg>
          <span id="lblBattery" class="text-xs font-semibold text-slate-200">--%</span>
        </div>

        <!-- Connect Button -->
        <button id="btnConnect" type="button" class="px-4 py-2.5 rounded-xl font-semibold text-xs sm:text-sm bg-blue-600 hover:bg-blue-500 active:scale-95 text-white shadow-md shadow-blue-600/30 transition flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M7 7l10 10-5 5V2l5 5L7 17"/>
          </svg>
          <span id="btnConnectLabel">Conectar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Controls Section -->
  <main class="my-5 space-y-5 flex-1">

    <!-- Brightness Card -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-sm font-semibold text-slate-200">Brilho</h2>
          <p class="text-xs text-slate-400">Intensidade da iluminação</p>
        </div>
        <div class="text-right">
          <span id="lblPercent" class="text-xl font-bold text-amber-400">15%</span>
        </div>
      </div>

      <div class="py-1">
        <input id="sliderBrilho" type="range" min="0" max="1000" value="150" class="w-full" aria-label="Controle de Brilho">
      </div>

      <!-- Quick Presets -->
      <div class="grid grid-cols-4 gap-2 pt-1">
        <button type="button" data-preset="0" class="preset-btn py-2.5 px-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700/80 text-xs font-medium text-slate-200 transition active:scale-95">
          🌙 Dormir<br><span class="text-[10px] text-amber-300">1%</span>
        </button>
        <button type="button" data-preset="180" class="preset-btn py-2.5 px-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700/80 text-xs font-medium text-slate-200 transition active:scale-95">
          🕯️ Penumbra<br><span class="text-[10px] text-slate-400">18%</span>
        </button>
        <button type="button" data-preset="550" class="preset-btn py-2.5 px-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700/80 text-xs font-medium text-slate-200 transition active:scale-95">
          📖 Leitura<br><span class="text-[10px] text-slate-400">55%</span>
        </button>
        <button type="button" data-preset="1000" class="preset-btn py-2.5 px-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 border border-slate-700/80 text-xs font-medium text-slate-200 transition active:scale-95">
          ☀️ Máximo<br><span class="text-[10px] text-amber-300">100%</span>
        </button>
      </div>
    </section>

    <!-- 6 Lighting Modes Grid -->
    <section class="space-y-2.5">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-sm font-semibold text-slate-200">Cenários</h2>
        <span id="lblActiveMode" class="text-xs font-medium text-amber-400">Branco Quente</span>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <!-- Mode 1 -->
        <button type="button" data-mode="1" class="mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-amber-500/15 border-amber-500/60 shadow-md">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-amber-300">Luz Contínua</span>
            <span class="text-base">🟠</span>
          </div>
          <div class="font-semibold text-sm text-white">Branco Quente</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Ambiente aconchegante</div>
        </button>

        <!-- Mode 2 -->
        <button type="button" data-mode="2" class="mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-slate-900/90 border-slate-800 hover:border-slate-700">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Luz Contínua</span>
            <span class="text-base">🌕</span>
          </div>
          <div class="font-semibold text-sm text-white">Branco Neutro</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Equilíbrio natural</div>
        </button>

        <!-- Mode 3 -->
        <button type="button" data-mode="3" class="mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-slate-900/90 border-slate-800 hover:border-slate-700">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Luz Contínua</span>
            <span class="text-base">❄️</span>
          </div>
          <div class="font-semibold text-sm text-white">Branco Frio</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Foco e nitidez</div>
        </button>

        <!-- Mode 4 -->
        <button type="button" data-mode="4" class="mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-slate-900/90 border-slate-800 hover:border-slate-700">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Efeito Dinâmico</span>
            <span class="text-base">🌬️</span>
          </div>
          <div class="font-semibold text-sm text-white">Vela ao Vento</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Chama viva oscilante</div>
        </button>

        <!-- Mode 5 -->
        <button type="button" data-mode="5" class="mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-slate-900/90 border-slate-800 hover:border-slate-700">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Efeito Dinâmico</span>
            <span class="text-base">⚡</span>
          </div>
          <div class="font-semibold text-sm text-white">Tempestade</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Luz quente e relâmpagos</div>
        </button>

        <!-- Mode 6 -->
        <button type="button" data-mode="6" class="mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-slate-900/90 border-slate-800 hover:border-slate-700">
          <div class="flex items-center justify-between mb-1.5">
            <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Efeito Dinâmico</span>
            <span class="text-base">🕯️</span>
          </div>
          <div class="font-semibold text-sm text-white">Vela Suave</div>
          <div class="text-[11px] text-slate-400 mt-0.5">Chama serena e contínua</div>
        </button>
      </div>
    </section>

  </main>

  <footer class="text-center text-[11px] text-slate-600 pt-2">
    Meu Abajur
  </footer>

  <script>
    const SERVICE_UUID = '19b10000-e8f2-537e-4f6c-d104768a1214';
    const CHAR_CONTROLE_UUID = '19b10001-e8f2-537e-4f6c-d104768a1214';
    const PWM_MAXIMO = 8191;
    const BRILHO_MINIMO_PWM = 1;

    const NOMES_MODOS = {
      1: 'Branco Quente',
      2: 'Branco Neutro',
      3: 'Branco Frio',
      4: 'Vela ao Vento',
      5: 'Tempestade',
      6: 'Vela Suave'
    };

    let bleDevice = null;
    let bleServer = null;
    let controleChar = null;
    let escritaEmAndamento = false;
    let comandoPendente = null;

    let estado = {
      modo: 1,
      permille: 150,
      pwm: 29,
      bateria: null
    };

    const btnConnect = document.getElementById('btnConnect');
    const btnConnectLabel = document.getElementById('btnConnectLabel');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const sliderBrilho = document.getElementById('sliderBrilho');
    const lblPercent = document.getElementById('lblPercent');
    const lblActiveMode = document.getElementById('lblActiveMode');
    const lampOrb = document.getElementById('lampOrb');
    const toastBanner = document.getElementById('toastBanner');
    const toastText = document.getElementById('toastText');
    const lblBattery = document.getElementById('lblBattery');
    const batteryIcon = document.getElementById('batteryIcon');
    const batteryFillRect = document.getElementById('batteryFillRect');

    let toastTimeout = null;
    function mostrarToast(msg) {
      toastText.textContent = msg;
      toastBanner.classList.remove('hidden');
      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastBanner.classList.add('hidden');
      }, 2500);
    }

    function calcularPwm13Bits(permille) {
      const m = Math.max(0, Math.min(1000, permille));
      const norm = m / 1000.0;
      const curva = norm * norm * norm;
      const pwm = BRILHO_MINIMO_PWM + Math.round(curva * (PWM_MAXIMO - BRILHO_MINIMO_PWM));
      return Math.max(BRILHO_MINIMO_PWM, Math.min(PWM_MAXIMO, pwm));
    }

    function atualizarIndicadorBateria() {
      if (estado.bateria === null || isNaN(estado.bateria)) {
        lblBattery.textContent = '--%';
        batteryIcon.setAttribute('class', 'w-4 h-4 text-slate-400');
        batteryFillRect.setAttribute('width', '0');
        return;
      }
      const bat = Math.max(0, Math.min(100, estado.bateria));
      lblBattery.textContent = `${bat}%`;
      const fillWidth = Math.max(1, Math.round((bat / 100) * 12));
      batteryFillRect.setAttribute('width', String(fillWidth));

      if (bat <= 20) {
        batteryIcon.setAttribute('class', 'w-4 h-4 text-rose-400');
      } else if (bat <= 45) {
        batteryIcon.setAttribute('class', 'w-4 h-4 text-amber-400');
      } else {
        batteryIcon.setAttribute('class', 'w-4 h-4 text-emerald-400');
      }
    }

    function atualizarInterface() {
      const pct = Math.max(1, Math.round(estado.permille / 10));
      lblPercent.textContent = `${pct}%`;
      lblActiveMode.textContent = NOMES_MODOS[estado.modo] || 'Branco Quente';

      const cards = document.querySelectorAll('.mode-card');
      cards.forEach(card => {
        const m = parseInt(card.getAttribute('data-mode'), 10);
        const badge = card.querySelector('span');
        if (m === estado.modo) {
          card.className = 'mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-amber-500/15 border-amber-500/70 shadow-md';
          if (badge) badge.className = 'text-xs font-bold uppercase tracking-wider text-amber-300';
        } else {
          card.className = 'mode-card text-left p-4 rounded-2xl border transition active:scale-95 bg-slate-900/90 border-slate-800 hover:border-slate-700';
          if (badge) badge.className = 'text-xs font-bold uppercase tracking-wider text-slate-400';
        }
      });

      const intensidadeVisual = 0.2 + (estado.permille / 1000) * 0.8;
      const corBrilho = (estado.modo === 3) ? '56, 189, 248' : (estado.modo === 2 ? '254, 249, 195' : '251, 191, 36');
      lampOrb.style.boxShadow = `0 0 ${Math.round(8 + intensidadeVisual * 26)}px rgba(${corBrilho}, ${intensidadeVisual * 0.65})`;

      atualizarIndicadorBateria();
    }

    async function enviarComandoBLE(texto) {
      if (!controleChar || !bleServer || !bleServer.connected) {
        return;
      }
      if (escritaEmAndamento) {
        comandoPendente = texto;
        return;
      }
      escritaEmAndamento = true;
      try {
        const encoder = new TextEncoder();
        const bytes = encoder.encode(texto);
        if (controleChar.writeValueWithoutResponse) {
          await controleChar.writeValueWithoutResponse(bytes);
        } else {
          await controleChar.writeValue(bytes);
        }
      } catch (err) {
        console.error('Erro BLE:', err);
      } finally {
        escritaEmAndamento = false;
        if (comandoPendente !== null) {
          const prox = comandoPendente;
          comandoPendente = null;
          enviarComandoBLE(prox);
        }
      }
    }

    function processarStatusRecebido(texto) {
      // Formato enviado pelo ESP32: "M:6,P:150,W:29,B:85"
      const partes = texto.split(',');
      partes.forEach(p => {
        const [chave, valStr] = p.split(':');
        const val = parseInt(valStr, 10);
        if (!isNaN(val)) {
          if (chave === 'M' && val >= 1 && val <= 6) estado.modo = val;
          if (chave === 'P') {
            estado.permille = Math.max(0, Math.min(1000, val));
            sliderBrilho.value = String(estado.permille);
          }
          if (chave === 'W') estado.pwm = val;
          if (chave === 'B') estado.bateria = Math.max(0, Math.min(100, val));
        }
      });
      atualizarInterface();
    }

    function aoDesconectarBLE() {
      statusDot.className = 'w-2 h-2 rounded-full bg-rose-500 inline-block';
      statusText.textContent = 'Desconectado';
      btnConnectLabel.textContent = 'Conectar';
      controleChar = null;
      estado.bateria = null;
      atualizarInterface();
      mostrarToast('Desconectado');
    }

    async function conectarBluetooth() {
      if (!navigator.bluetooth) {
        mostrarToast('Bluetooth não disponível neste navegador');
        return;
      }

      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
        return;
      }

      try {
        statusText.textContent = 'Conectando...';
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'Meu Abajur' }, { services: [SERVICE_UUID] }],
          optionalServices: [SERVICE_UUID]
        });

        bleDevice.addEventListener('gattserverdisconnected', aoDesconectarBLE);
        bleServer = await bleDevice.gatt.connect();
        const service = await bleServer.getPrimaryService(SERVICE_UUID);
        controleChar = await service.getCharacteristic(CHAR_CONTROLE_UUID);

        await controleChar.startNotifications();
        controleChar.addEventListener('characteristicvaluechanged', (event) => {
          const msg = new TextDecoder().decode(event.target.value);
          processarStatusRecebido(msg);
        });

        const valorInicial = await controleChar.readValue();
        processarStatusRecebido(new TextDecoder().decode(valorInicial));

        statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400 inline-block';
        statusText.textContent = 'Conectado';
        btnConnectLabel.textContent = 'Sair';
        mostrarToast('Conectado');
      } catch (err) {
        statusDot.className = 'w-2 h-2 rounded-full bg-rose-500 inline-block';
        statusText.textContent = 'Desconectado';
      }
    }

    btnConnect.addEventListener('click', conectarBluetooth);

    sliderBrilho.addEventListener('input', () => {
      const permille = parseInt(sliderBrilho.value, 10);
      estado.permille = permille;
      estado.pwm = calcularPwm13Bits(permille);
      atualizarInterface();
      enviarComandoBLE(`P:${permille}`);
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const p = parseInt(btn.getAttribute('data-preset'), 10);
        sliderBrilho.value = String(p);
        estado.permille = p;
        estado.pwm = calcularPwm13Bits(p);
        atualizarInterface();
        enviarComandoBLE(`P:${p}`);
      });
    });

    document.querySelectorAll('.mode-card').forEach(card => {
      card.addEventListener('click', () => {
        const m = parseInt(card.getAttribute('data-mode'), 10);
        estado.modo = m;
        atualizarInterface();
        enviarComandoBLE(`M:${m}`);
      });
    });

    atualizarInterface();
  </script>
</body>
</html>
